name: DSH compatibility matrix

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [dsh-release]
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Exact published DSH version to exercise through the release-candidate path
        required: false
        type: string
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: matrix
        name: Resolve published DSH versions
        shell: pwsh
        env:
          DSH_CANDIDATE_VERSION: ${{ inputs.candidate_version || github.event.client_payload.version || '' }}
        run: |
          $matrix = node scripts/resolve-dsh-ci-matrix.mjs
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  verify:
    needs: configure
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build trusted matrix artifacts
        run: |
          pnpm run pack:fixture
          pnpm run pack:hub
      - name: Install exact published DSH package
        shell: pwsh
        run: |
          $matrixRoot = Join-Path $env:RUNNER_TEMP "dsh-${{ matrix.role }}-${{ matrix.version }}"
          New-Item -ItemType Directory -Force -Path $matrixRoot | Out-Null
          '{"name":"dsh-matrix-runtime","private":true,"version":"0.0.0"}' | Set-Content -LiteralPath (Join-Path $matrixRoot 'package.json') -Encoding utf8
          Copy-Item -LiteralPath 'pnpm-workspace.yaml' -Destination (Join-Path $matrixRoot 'pnpm-workspace.yaml')
          pnpm --dir $matrixRoot add --save-exact "@deepseek-ai/dsh@${{ matrix.version }}"
          "DSH_PACKAGE_ROOT=$matrixRoot/node_modules/@deepseek-ai/dsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Web, Bootstrap, client module and rescue contract
        run: pnpm run ui:verify-dsh-version-entry
        env:
          DSH_MATRIX_VERSION: ${{ matrix.version }}
          DSH_MATRIX_EXPECTED: ${{ matrix.expected }}
          DSH_MATRIX_ROLE: ${{ matrix.role }}
      - name: Verify current DSH full update, uninstall and rollback lifecycle
        if: matrix.verification == 'full-lifecycle'
        shell: pwsh
        run: |
          $output = "evidence-ci/dsh-matrix/${{ runner.os }}/current-native-ui-${{ matrix.version }}.json"
          node scripts/verify-native-ui-lifecycle.mjs artifacts/harness-flow-dsh-flow-hub-0.0.2-m0.tgz artifacts/harness-flow-hello-bundle-0.0.1-m0.tgz $output
      - name: Verify trusted release candidate through the native UI lifecycle
        if: matrix.verification == 'release-regression' && matrix.expected == 'compatible'
        shell: pwsh
        run: |
          $output = "evidence-ci/dsh-matrix/${{ runner.os }}/candidate-native-ui-${{ matrix.version }}.json"
          node scripts/verify-native-ui-lifecycle.mjs artifacts/harness-flow-dsh-flow-hub-0.0.2-m0.tgz artifacts/harness-flow-hello-bundle-0.0.1-m0.tgz $output
      - name: Qualify in-range release candidate install, update, uninstall and rollback
        if: matrix.verification == 'release-regression' && matrix.expected != 'incompatible'
        shell: pwsh
        run: |
          $root = "evidence-ci/dsh-matrix/${{ runner.os }}"
          node scripts/verify-transaction-lifecycle.mjs "$root/candidate-transaction-${{ matrix.version }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-transaction-version-lifecycle.mjs "$root/candidate-version-lifecycle-${{ matrix.version }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-rollback-lifecycle.mjs "$root/candidate-rollback-${{ matrix.version }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-compatibility-${{ matrix.os }}-${{ matrix.role }}-${{ matrix.version }}
          path: |
            evidence-ci/dsh-matrix/**/*.json
          if-no-files-found: error
