name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - registry/generated/registry.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/styles.css _site/styles.css
          cp site/app.js _site/app.js
          cp registry/generated/registry.json _site/registry.json
          touch _site/.nojekyll
      - name: Block public disclosure
        run: node scripts/audit-public-site.mjs _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
