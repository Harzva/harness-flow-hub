name: Registry contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run registry:validate-inputs
      - run: pnpm run registry:audit-candidates
      - run: pnpm run registry:generate
      - run: pnpm run registry:validate
      - run: pnpm check
      - run: pnpm run registry:assemble-release
      - run: pnpm run registry:validate-release-candidate
      - name: Generated registry must be committed and deterministic
        shell: pwsh
        run: git diff --exit-code -- registry/generated/registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: registry-alpha-candidate-${{ github.sha }}
          path: dist/registry/2026.08.16-alpha.1/
          if-no-files-found: error

  install-transaction:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run registry:validate-inputs
      - name: Locate the official DSH package
        shell: pwsh
        run: |
          $root = pnpm root
          "DSH_PACKAGE_ROOT=$root/@deepseek-ai/dsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DSH_VERSION=0.1.0-rc.6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify ten package transactions without running third-party code
        run: node scripts/verify-installations.mjs registry/generated/registry.json registry/verifications-ci/${{ runner.os }} 10
      - name: Build trusted native UI lifecycle fixtures
        run: |
          pnpm run pack:fixture
          pnpm run pack:hub
      - name: Verify read-only, incompatible, update guidance and CLI rescue modes
        run: pnpm run ui:verify-bootstrap-compatibility
      - name: Verify native UI lifecycle and failed-transaction recovery
        run: pnpm run ui:verify-lifecycle
      - name: Verify installed Profiles remain manageable while upstream Registry is unreachable
        run: pnpm run ui:verify-registry-offline
      - name: Verify aggregate Flow transaction and deterministic Stack lock
        run: pnpm run transaction:verify-flow
      - name: Verify M2 native UI Bootstrap and transaction installer release gate
        run: pnpm run m2:verify-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-install-transaction-${{ runner.os }}
          path: |
            registry/verifications-ci/${{ runner.os }}/*.json
            evidence/m2-bootstrap-recovery-modes-2026-08-16.json
            evidence/m2-native-ui-lifecycle-2026-08-16.json
            evidence/m2-registry-offline-resilience-2026-08-17.json
            evidence/m2-flow-transaction-lifecycle-2026-08-16.json
            evidence/m2-native-ui-bootstrap-transaction-core-2026-08-17.json
