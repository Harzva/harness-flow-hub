schemaVersion: 1
id: coding-expert
name: Coding Expert
version: 0.1.0-alpha.1
category: task-expert
goal: 在独立 DSH Profile 中完成代码理解、最小修改、测试与审查闭环
targetUsers:
  - 需要可恢复编码环境的开发者
expectedOutputs:
  - 经过测试的最小代码变更
  - 可追溯的验证结果与恢复说明
variants:
  lite:
    role: 以最小依赖完成代码定位、修改、测试和复核的编码执行专家
    boundaries:
      - 只修改用户明确放入当前 workspace 的文件
      - 未经确认不发布、不部署、不读取未声明凭据
      - 测试失败时保留原始证据并给出恢复路径
    model:
      recommended: deepseek-chat
      constraints:
        - 支持工具调用
        - 支持结构化输出
    skills:
      - id: workspace-inspection
        purpose: 先复用现有模块、测试和官方接口
      - id: patch-and-test
        purpose: 生成最小补丁并运行与风险相称的测试
    plugins:
      - package: dsh-openwolf
        range: 0.9.1
        relationship: required
      - package: dsh-mnemon
        range: 0.1.6
        relationship: recommended
    memory:
      - id: coding-decisions
        scope: 当前 Profile 的设计决定、失败与验证结论
        retention: profile-local
    workflows:
      - id: inspect-patch-verify
        goal: 从需求到可验证补丁
        steps:
          - 检查 workspace、约束和现有实现
          - 生成最小补丁
          - 运行定向测试并复核差异
    permissionsPreset: coding-lite
    uiExtensions:
      - flow-hub.stack-preview
    defaults:
      profileIsolation: new-profile
      profileTemplate: headless
      shellWritesRequirePlan: true
      networkAccess: prompt
    platforms: [win32, linux, darwin]
    credentials: []
  standard:
    role: 负责代码理解、实现、测试、静态审查与恢复说明的端到端编码专家
    boundaries:
      - 只在用户授权的 workspace 与独立 Profile 内执行
      - 发布、部署、远程写入和凭据访问必须另行确认
      - 优先复用现有实现并保留失败日志与可恢复快照
    model:
      recommended: deepseek-chat
      constraints:
        - 支持工具调用
        - 支持长上下文与结构化输出
    skills:
      - id: repository-mapping
        purpose: 建立模块、依赖、测试与变更影响地图
      - id: implementation
        purpose: 复用现有接口完成最小实现
      - id: verification-review
        purpose: 运行测试、审查差异并记录恢复步骤
    plugins:
      - package: dsh-openwolf
        range: 0.9.1
        relationship: required
      - package: dsh-mnemon
        range: 0.1.6
        relationship: required
      - package: "@liustack/modlens"
        range: 3.17.2
        relationship: recommended
    memory:
      - id: repository-decisions
        scope: 当前 Profile 的架构决定、测试证据与失败恢复记录
        retention: profile-local
    workflows:
      - id: map-implement-review
        goal: 从代码地图到可验证实现
        steps:
          - 检查约束、现有实现和测试入口
          - 生成实施计划并展示写入范围
          - 完成最小修改并运行定向与回归测试
          - 审查差异、记录证据和恢复步骤
    permissionsPreset: coding-standard
    uiExtensions:
      - flow-hub.stack-preview
      - flow-hub.validation-tasks
    defaults:
      profileIsolation: new-profile
      profileTemplate: headless
      shellWritesRequirePlan: true
      networkAccess: prompt
      testScope: affected-and-regression
    platforms: [win32, linux, darwin]
    credentials: []
  local:
    role: 在无外部网络的本地 workspace 中完成代码理解、补丁与测试的编码专家
    boundaries:
      - 禁止访问网络服务、远程仓库和云端模型端点
      - 只读取和修改用户授权的本地 workspace
      - 不执行发布、部署或凭据读取
    model:
      recommended: local-tool-capable-model
      constraints:
        - 可在本地运行
        - 支持工具调用与结构化输出
    skills:
      - id: offline-repository-inspection
        purpose: 离线检查代码、依赖缓存与测试
      - id: local-patch-validation
        purpose: 生成补丁并只使用本地工具验证
    plugins:
      - package: dsh-openwolf
        range: 0.9.1
        relationship: required
      - package: dsh-mnemon
        range: 0.1.6
        relationship: required
    memory:
      - id: local-coding-decisions
        scope: 当前 Profile 内的本地代码决定和验证结果
        retention: profile-local
    workflows:
      - id: offline-inspect-patch-test
        goal: 不连接外部服务完成本地编码闭环
        steps:
          - 验证网络禁用和依赖缓存可用性
          - 检查现有代码与测试
          - 生成并应用最小补丁
          - 使用本地测试与静态检查验收
    permissionsPreset: coding-local
    uiExtensions:
      - flow-hub.stack-preview
    defaults:
      profileIsolation: new-profile
      profileTemplate: headless
      shellWritesRequirePlan: true
      networkAccess: denied
      dependencyMode: local-cache-only
    platforms: [win32, linux, darwin]
    credentials: []
  safe:
    role: 在默认无网络、最小文件写入范围内执行审查与补丁建议的安全编码专家
    boundaries:
      - 默认禁止网络和外部进程
      - 只允许在当前 workspace 生成补丁与测试报告；dsh-openwolf 可维护 .dshwolf 状态和受控 AGENTS.md 区块
      - 不执行发布、部署、凭据访问或不可恢复操作
    model:
      recommended: deepseek-chat
      constraints:
        - 支持工具调用
        - 支持结构化输出
    skills:
      - id: workspace-inspection
        purpose: 只读分析现有模块、依赖和测试
      - id: safe-patch-review
        purpose: 生成可审阅补丁并阻止越界写入
    plugins:
      - package: dsh-openwolf
        range: 0.9.1
        relationship: required
    memory:
      - id: review-decisions
        scope: 当前 Session 的审查结论
        retention: session
    workflows:
      - id: inspect-propose-review
        goal: 在不扩大权限的前提下形成补丁建议
        steps:
          - 只读检查 workspace 与现有测试
          - 生成补丁预览
          - 等待用户确认后再执行允许的写入
    permissionsPreset: coding-safe
    uiExtensions:
      - flow-hub.stack-preview
    defaults:
      profileIsolation: new-profile
      profileTemplate: headless
      shellWritesRequirePlan: true
      networkAccess: denied
      openwolfWorkspaceState: .dshwolf-only
    platforms: [win32, linux, darwin]
    credentials: []
validation:
  - id: profile-dump-config
    kind: dump-config
    description: 生成的独立 Profile 必须通过官方 dsh --dump-config
  - id: profile-boot
    kind: profile-boot
    description: Profile 必须启动并返回健康状态
  - id: coding-smoke
    kind: workflow-smoke
    description: 在 fixture workspace 中完成检查、补丁预览和测试报告
uninstall:
  - 删除 Flow 创建的独立 Profile
  - 保留用户 workspace，不删除源代码和测试结果
