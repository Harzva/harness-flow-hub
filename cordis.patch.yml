- insert:
    - id: harness-flow-hub
      name: '@harness-flow/dsh-flow-hub'
      inject: [webServer]
      config:
        profile: web
        fixtureSpec: !!js process.env.DSH_FLOW_HUB_FIXTURE
        registryUrl: !!js process.env.DSH_FLOW_HUB_REGISTRY_URL
        testFailAt: !!js process.env.DSH_FLOW_HUB_TEST_FAIL_AT
        testDshVersion: !!js process.env.DSH_FLOW_HUB_TEST_DSH_VERSION
